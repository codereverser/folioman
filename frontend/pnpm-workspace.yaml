# pnpm: allow these deps to run install/build scripts.
# esbuild + vue-demi for Vite, sharp for the PWA icon generator.
allowBuilds:
  esbuild: true
  sharp: true
  vue-demi: true

# Force patched deps past transitive DoS advisories (quadratic blowups in js-yaml
# merge-key and !!omap resolution). openapi-typescript's @redocly/openapi-core pins
# js-yaml at 4.1.1 exactly, so the only way up is an override; 4.3.x is
# API-compatible. Drop this once redocly bumps it.
# sharp <0.35 bundles a libvips with several image-parsing CVEs; the PWA icon
# generator pins ^0.33.5, so override until @vite-pwa/assets-generator moves up.
overrides:
  js-yaml: 4.3.1
  sharp: ^0.35.0
